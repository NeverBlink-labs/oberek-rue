name: OBEREK RUE
tagline: Open environmental monitoring for l'Albufera de València – water quality, habitat health and community feedback in one place.
status: In deployment        # In deployment / Live / Maintenance
last_updated: "2026-09-23"

summary: |
  OBEREK brings together data from water-quality sensors, existing monitoring
  networks, satellite imagery and a community poll to show the state of
  l'Albufera de València, the coastal lagoon and wetland south of Valencia.

  From this data it builds three **Key Ecological Indicators (KEIs)**, each
  shown on a five-level scale from Very good to Critical. They give local
  authorities, farmers and fishers, researchers and residents a simple
  overview. They are not official or regulatory indices.

  Readings are published automatically before full quality checks, so treat
  them as provisional. The reference values used for scoring are still under
  scientific review.

indicators:
  - name: "KEI-1: Water quality"
    description: Condition of the lagoon water. Sensor readings and satellite estimates are compared with reference values based on scientific literature and expert judgement.
  - name: "KEI-2: Habitat health"
    description: Condition of the water and land habitats. Uses the same water data plus wind speed and rice blast risk (a fungal disease of rice) from weather stations. The worse of the water and land results is shown.
  - name: "KEI-3: Community feedback"
    description: How closely people's own rating of the environment, from the community poll, matches KEI-1 and KEI-2. A high level means the two agree, not that the environment is in good condition. Values appear once poll responses come in.

sources:
  - name: Water-quality sensors (UPV)
    description: Sensors at three sites in the lagoon, run by the Universitat Politècnica de València. They measure pH, dissolved oxygen, electrical conductivity, salinity, turbidity and water temperature. Used in KEI-1 and KEI-2.
  - name: Flow gauging stations (CHJ)
    description: Daily data from the Júcar river basin authority (Confederación Hidrográfica del Júcar) on the lagoon's water level and the flow through the golas, the channels linking the lagoon to the sea. Shown for context only and not used in the scores.
  - name: AVAMET weather stations
    description: Stations at Tancat de la Pipa and Tancat de l'Estell, from the Valencian Meteorology Association (AVAMET). Wind speed and a rice blast risk index, worked out from humidity, temperature, rainfall and leaf wetness, are used in KEI-2. Other weather readings are shown for context.
  - name: Copernicus Sentinel-2 satellite
    description: Satellite estimates of chlorophyll-a, phycocyanin (both signs of algae) and Secchi depth (water clarity), used in KEI-1 and KEI-2. Vegetation and water layers such as NDVI and NDWI are shown for context only.
  - name: Community perception poll
    description: Open, anonymous poll on the dashboard for anyone connected to the Albufera region. Its results are used in KEI-3.

